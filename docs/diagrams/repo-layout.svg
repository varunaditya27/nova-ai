<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 610" width="1100" height="610" role="img" aria-label="Repository layout: the backend holds the thirteen layers and the pipeline; api, infra, background, migrations and config support it; docs, tests, scripts, frontend, film and docker sit alongside." font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="12">
<rect x="0.5" y="0.5" width="1099" height="609" fill="#faf7f5" stroke="#d9d0c8"/>
<text x="22" y="28" font-size="11" fill="#1a1a1a" font-weight="700">REPOSITORY LAYOUT</text>
<path d="M40 76 L40 536" fill="none" stroke="#1a1a1a" stroke-width="1"/>
<path d="M40 96 L64 96 M40 136 L64 136 M40 176 L64 176 M40 216 L64 216 M40 256 L64 256 M40 296 L64 296 M40 336 L64 336 M40 376 L64 376 M40 416 L64 416 M40 456 L64 456 M40 496 L64 496 M40 536 L64 536" fill="none" stroke="#1a1a1a" stroke-width="1"/>
<text x="80" y="100" font-weight="700" fill="#800000" font-size="13">backend/</text>
<text x="260" y="100" font-size="12" fill="#5a524b">13 layer packages (130 modules) + pipeline/: orchestrator, System 1/2, state updater</text>
<text x="80" y="140" font-weight="700" fill="#1a1a1a" font-size="13">api/</text>
<text x="260" y="140" font-size="12" fill="#5a524b">FastAPI app: routes, streaming, layer assembly, app state</text>
<text x="80" y="180" font-weight="700" fill="#1a1a1a" font-size="13">infra/</text>
<text x="260" y="180" font-size="12" fill="#5a524b">LLM clients, Postgres and Chroma adapters, session cache</text>
<text x="80" y="220" font-weight="700" fill="#1a1a1a" font-size="13">background/</text>
<text x="260" y="220" font-size="12" fill="#5a524b">APScheduler jobs</text>
<text x="80" y="260" font-weight="700" fill="#1a1a1a" font-size="13">migrations/</text>
<text x="260" y="260" font-size="12" fill="#5a524b">Alembic schema migrations</text>
<text x="80" y="300" font-weight="700" fill="#1a1a1a" font-size="13">config/</text>
<text x="260" y="300" font-size="12" fill="#5a524b">defaults.yaml + layer1.yaml … layer13.yaml</text>
<text x="80" y="340" font-weight="700" fill="#1a1a1a" font-size="13">docs/</text>
<text x="260" y="340" font-size="12" fill="#5a524b">master architecture doc, per-layer specs, API reference, diagrams/, superpowers/</text>
<text x="80" y="380" font-weight="700" fill="#1a1a1a" font-size="13">tests/</text>
<text x="260" y="380" font-size="12" fill="#5a524b">unit/, integration/, integration_infra/</text>
<text x="80" y="420" font-weight="700" fill="#1a1a1a" font-size="13">scripts/</text>
<text x="260" y="420" font-size="12" fill="#5a524b">run_local.sh: the full pipeline, offline</text>
<text x="80" y="460" font-weight="700" fill="#006680" font-size="13">frontend/</text>
<text x="260" y="460" font-size="12" fill="#5a524b">Next.js web app (see frontend/README.md)</text>
<text x="80" y="500" font-weight="700" fill="#1a1a1a" font-size="13">film/</text>
<text x="260" y="500" font-size="12" fill="#5a524b">Remotion source for the /welcome films</text>
<text x="80" y="540" font-weight="700" fill="#1a1a1a" font-size="13">docker/</text>
<text x="260" y="540" font-size="12" fill="#5a524b">docker-compose.yml + per-service Dockerfiles</text>
<text x="22" y="588" font-size="10.5" fill="#5a524b">Top-level folders. Maroon marks the Python backend; teal marks the web frontend.</text>
</svg>
