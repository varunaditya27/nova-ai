<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="deletion-cascade-title deletion-cascade-desc" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="12">
<title id="deletion-cascade-title">Layer 12: deletion steps</title>
<desc id="deletion-cascade-desc">After a confirmed request and a dry run, deletion removes the memory, cascades to what it supported, then issues a certificate and records it in the privacy chain.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#1a1a1a"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#800000"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#006680"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#006600"/></marker><marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#b45309"/></marker></defs>
<rect x="0.5" y="0.5" width="1099" height="519" fill="#faf7f5" stroke="#d9d0c8"/>
<text x="22" y="28" font-size="11" fill="#1a1a1a" font-weight="700">LAYER 12 · SELECTIVE DELETION</text>
<rect x="40" y="40" width="1020" height="50" fill="#faf7f5" stroke="#5a524b" stroke-width="1.3"/>
<text x="550.0" y="62.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#5a524b">Preconditions</text>
<text x="550.0" y="80.0" text-anchor="middle" font-size="10.5" fill="#5a524b">the request is confirmed and a dry run has been reviewed</text>
<path d="M550 90 L550 110" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="110" width="1020" height="300" fill="none" stroke="#5a524b" stroke-width="1" stroke-dasharray="2 3"/>
<text x="52" y="128" font-size="10.5" font-weight="700" fill="#5a524b">Execute in one database transaction</text>
<rect x="52" y="150" width="180" height="84" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="142.0" y="172.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">1 · Resolve IDs</text>
<text x="142.0" y="190.0" text-anchor="middle" font-size="10.5" fill="#5a524b">in the requested scope</text>
<rect x="256" y="150" width="180" height="84" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="346.0" y="172.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">2 · Zero embeddings</text>
<text x="346.0" y="190.0" text-anchor="middle" font-size="10.5" fill="#5a524b">remove from vector store</text>
<rect x="460" y="150" width="180" height="84" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="550.0" y="172.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">3 · Secure delete</text>
<text x="550.0" y="190.0" text-anchor="middle" font-size="10.5" fill="#5a524b">structured store rows</text>
<rect x="664" y="150" width="180" height="84" fill="#f8ead9" stroke="#b45309" stroke-width="1.3"/>
<text x="754.0" y="172.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#b45309">4 · Cascade: facts</text>
<text x="754.0" y="190.0" text-anchor="middle" font-size="10.5" fill="#5a524b">semantic facts affected</text>
<rect x="868" y="150" width="180" height="84" fill="#f8ead9" stroke="#b45309" stroke-width="1.3"/>
<text x="958.0" y="172.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#b45309">5 · Cascade: traits</text>
<text x="958.0" y="190.0" text-anchor="middle" font-size="10.5" fill="#5a524b">recompute vector if hit</text>
