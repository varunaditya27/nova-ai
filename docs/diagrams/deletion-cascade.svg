<text x="550.0" y="330.0" text-anchor="middle" font-size="10.5" fill="#5a524b">signed deletion receipt</text>
<rect x="664" y="290" width="180" height="84" fill="#e3eff2" stroke="#006680" stroke-width="1.3"/>
<text x="754.0" y="312.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#006680">9 · Privacy chain</text>
<text x="754.0" y="330.0" text-anchor="middle" font-size="10.5" fill="#5a524b">append to privacy chain</text>
