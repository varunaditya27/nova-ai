<text x="346.0" y="330.0" text-anchor="middle" font-size="10.5" fill="#5a524b">if the cascade requires</text>
<rect x="460" y="290" width="180" height="84" fill="#e3eff2" stroke="#006680" stroke-width="1.3"/>
