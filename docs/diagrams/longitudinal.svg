<title id="longitudinal-title">Layer 10: longitudinal inputs, workers and consumers</title>
<desc id="longitudinal-desc">Five source layers feed a life calendar, which triggers four workers; their outputs go to a shared bus, read by Layer 6, Layer 4 and the user-facing exports.</desc>
