<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" role="img" aria-labelledby="privacy-storage-title privacy-storage-desc" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="12">
<title id="privacy-storage-title">Layer 12: on-device storage, sync server and second device (design)</title>
<desc id="privacy-storage-desc">Stores and a privacy agent sit on the first device; only encrypted deltas reach the sync server, which cannot read them; a second device decrypts locally.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#1a1a1a"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#800000"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#006680"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#006600"/></marker><marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#b45309"/></marker></defs>
<rect x="0.5" y="0.5" width="1099" height="759" fill="#faf7f5" stroke="#d9d0c8"/>
<text x="22" y="28" font-size="11" fill="#1a1a1a" font-weight="700">LAYER 12 · PRIVACY &amp; DATA (DESIGN)</text>
<rect x="40" y="50" width="1020" height="330" fill="none" stroke="#5a524b" stroke-width="1" stroke-dasharray="2 3"/>
<text x="52" y="68" font-size="10.5" font-weight="700" fill="#5a524b">User&#x27;s device (primary)</text>
<rect x="60" y="80" width="232" height="72" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="176.0" y="102.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">memory.db</text>
<text x="176.0" y="120.0" text-anchor="middle" font-size="10.5" fill="#5a524b">episodic, semantic, identity</text>
<rect x="306" y="80" width="232" height="72" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="422.0" y="102.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">vector index</text>
<text x="422.0" y="120.0" text-anchor="middle" font-size="10.5" fill="#5a524b">embeddings (ChromaDB)</text>
<rect x="552" y="80" width="232" height="72" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="668.0" y="102.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">longitudinal.db</text>
<text x="668.0" y="120.0" text-anchor="middle" font-size="10.5" fill="#5a524b">Layer 10 data</text>
<rect x="798" y="80" width="232" height="72" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="914.0" y="102.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">personality.db</text>
<text x="914.0" y="120.0" text-anchor="middle" font-size="10.5" fill="#5a524b">personality vector, drift history</text>
<rect x="60" y="164" width="232" height="72" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="176.0" y="186.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">goals.db</text>
<text x="176.0" y="204.0" text-anchor="middle" font-size="10.5" fill="#5a524b">Layer 7 goal state</text>
<rect x="306" y="164" width="232" height="72" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="422.0" y="186.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">safety.db</text>
<text x="422.0" y="204.0" text-anchor="middle" font-size="10.5" fill="#5a524b">Layer 11 safety record</text>
<rect x="552" y="164" width="232" height="72" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="668.0" y="186.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">audit.db</text>
<text x="668.0" y="204.0" text-anchor="middle" font-size="10.5" fill="#5a524b">audit index, deletion log</text>
<rect x="798" y="164" width="232" height="72" fill="#800000" stroke="#800000" stroke-width="1.3"/>
<text x="914.0" y="186.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#faf7f5">keystore/</text>
<text x="914.0" y="204.0" text-anchor="middle" font-size="10.5" fill="#faf7f5">hardware-bound keys</text>
<rect x="60" y="262" width="980" height="56" fill="#faf7f5" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="550.0" y="284.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">Privacy Agent</text>
<text x="550.0" y="302.0" text-anchor="middle" font-size="10.5" fill="#5a524b">EncryptionManager · DeletionExecutor · AuditIndexBuilder · SyncCoordinator · IntegrityVerifier · ConsentManager</text>
<path d="M550 380 L550 430" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="562" y="412" text-anchor="start" font-size="10.5" fill="#5a524b">encrypted sync deltas only</text>
<rect x="340" y="430" width="420" height="130" fill="#e3eff2" stroke="#006680" stroke-width="1.3"/>
<text x="550.0" y="452.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#006680">Nova sync server</text>
<text x="550.0" y="470.0" text-anchor="middle" font-size="10.5" fill="#5a524b">stores opaque AES-256-GCM ciphertext</text>
<text x="550.0" y="485.0" text-anchor="middle" font-size="10.5" fill="#5a524b">sees: account_id, blob_size, sync_timestamp</text>
<text x="550.0" y="500.0" text-anchor="middle" font-size="10.5" fill="#5a524b">never sees: key, plaintext, content, identity</text>
<path d="M550 560 L550 620" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="562" y="596" text-anchor="start" font-size="10.5" fill="#5a524b">pull</text>
<rect x="340" y="620" width="420" height="100" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="550.0" y="642.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">User&#x27;s device (secondary)</text>
<text x="550.0" y="660.0" text-anchor="middle" font-size="10.5" fill="#5a524b">decrypts with the user&#x27;s key, locally</text>
<text x="550.0" y="675.0" text-anchor="middle" font-size="10.5" fill="#5a524b">populates its own local store</text>
<text x="22" y="744" font-size="10.5" fill="#5a524b">Design per the Layer 12 spec. Encryption at rest is not deployed; live data is in Postgres (CLAUDE.md).</text>
</svg>
