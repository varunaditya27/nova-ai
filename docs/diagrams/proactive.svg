<rect x="340" y="232" width="420" height="56" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="550.0" y="254.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">SC-1 · Proactive Queue Manager</text>
<text x="550.0" y="272.0" text-anchor="middle" font-size="10.5" fill="#5a524b">always running; polls every 30 minutes</text>
<rect x="340" y="318" width="420" height="56" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="550.0" y="340.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">SC-2 · Initiative Classifier</text>
<text x="550.0" y="358.0" text-anchor="middle" font-size="10.5" fill="#5a524b">per candidate, deterministic, under 5 ms</text>
<rect x="340" y="404" width="420" height="56" fill="#800000" stroke="#800000" stroke-width="1.3"/>
<text x="550.0" y="426.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#faf7f5">SC-3 · Timing &amp; Delivery Gate</text>
<text x="550.0" y="444.0" text-anchor="middle" font-size="10.5" fill="#faf7f5">the primary safeguard; under 10 ms per item</text>
<path d="M550 288 L550 318" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M550 374 L550 404" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M550 460 L550 474" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M550 474 L270 474 L270 486" fill="none" stroke="#5a524b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M550 474 L830 474 L830 486" fill="none" stroke="#006600" stroke-width="1.5" marker-end="url(#g)"/>
<rect x="40" y="486" width="460" height="56" fill="#faf7f5" stroke="#5a524b" stroke-width="1.3"/>
<text x="270.0" y="508.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#5a524b">DEFER or SUPPRESS</text>
<text x="270.0" y="526.0" text-anchor="middle" font-size="10.5" fill="#5a524b">back to SC-1; the gate records a reason</text>
<path d="M40 514 L24 514 L24 260 L340 260" fill="none" stroke="#5a524b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<rect x="600" y="486" width="460" height="56" fill="#e6f1e6" stroke="#006600" stroke-width="1.3"/>
<text x="830.0" y="508.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#006600">SEND_NOW</text>
<text x="830.0" y="526.0" text-anchor="middle" font-size="10.5" fill="#5a524b">SC-4 generates the message (LLM, under 400 ms)</text>
<path d="M830 542 L830 590" fill="none" stroke="#006600" stroke-width="1.5" marker-end="url(#g)"/>
<rect x="600" y="590" width="460" height="56" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="830.0" y="612.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">SC-5 · Response Tracker</text>
<text x="830.0" y="630.0" text-anchor="middle" font-size="10.5" fill="#5a524b">after sending: user reaction updates priority</text>
<path d="M830 646 L830 680" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="600" y="680" width="460" height="56" fill="#e3eff2" stroke="#006680" stroke-width="1.3"/>
<text x="830.0" y="702.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#006680">Notification API → user device</text>
<text x="830.0" y="720.0" text-anchor="middle" font-size="10.5" fill="#5a524b">push, in-app, or WhatsApp Business API</text>
<text x="22" y="864" font-size="10.5" fill="#5a524b">Blocking gate conditions are evaluated in order; the first blocking condition decides</text>
</svg>
