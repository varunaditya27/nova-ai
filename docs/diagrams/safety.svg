<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="safety-title safety-desc" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="12">
<title id="safety-title">Layer 11: safety agent, veto gate and guardrails</title>
<desc id="safety-desc">Every message passes a parallel crisis path; a Tier 1 or Tier 2 signal sends the veto gate to replace the proposed reply, and the guardrail filter checks every reply.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#1a1a1a"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#800000"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#006680"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#006600"/></marker><marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#b45309"/></marker></defs>
<rect x="0.5" y="0.5" width="1099" height="559" fill="#faf7f5" stroke="#d9d0c8"/>
<text x="22" y="28" font-size="11" fill="#1a1a1a" font-weight="700">LAYER 11 · SAFETY &amp; CRISIS</text>
<rect x="40" y="50" width="600" height="470" fill="none" stroke="#5a524b" stroke-width="1" stroke-dasharray="2 3"/>
<text x="52" y="68" font-size="10.5" font-weight="700" fill="#5a524b">Safety Agent · persistent parallel process, never blocked</text>
<rect x="60" y="84" width="300" height="44" fill="#faf7f5" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="210.0" y="110.3" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">Every incoming message</text>
<path d="M210 128 L210 160" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60" y="160" width="300" height="60" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="210.0" y="182.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">SC-2 · Crisis Detection Engine</text>
<text x="210.0" y="200.0" text-anchor="middle" font-size="10.5" fill="#5a524b">runs on every message</text>
<path d="M210 220 L210 260" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="222" y="244" text-anchor="start" font-size="10.5" fill="#5a524b">CrisisSignal</text>
<rect x="60" y="260" width="300" height="60" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="210.0" y="282.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">SC-3 · Escalation Protocol</text>
<text x="210.0" y="300.0" text-anchor="middle" font-size="10.5" fill="#5a524b">fires only on Tier 1 or Tier 2 signals</text>
<path d="M210 320 L210 360" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60" y="360" width="300" height="66" fill="#f6e6e6" stroke="#800000" stroke-width="1.3"/>
<text x="210.0" y="382.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#800000">VETO GATE</text>
<text x="210.0" y="400.0" text-anchor="middle" font-size="10.5" fill="#5a524b">crisis: discard the main reply,</text>
<text x="210.0" y="415.0" text-anchor="middle" font-size="10.5" fill="#5a524b">inject the crisis response</text>
<rect x="396" y="160" width="236" height="60" fill="#faf7f5" stroke="#5a524b" stroke-width="1.3"/>
<text x="514.0" y="182.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#5a524b">SC-4 · Dependency Monitor</text>
<text x="514.0" y="200.0" text-anchor="middle" font-size="10.5" fill="#5a524b">runs weekly, not per message</text>
<path d="M360 390 L560 390 L560 230 L740 230" fill="none" stroke="#800000" stroke-width="1.5" marker-end="url(#m)"/>
<text x="572" y="350" text-anchor="start" font-size="10.5" fill="#800000" font-weight="700">replaces the reply</text>
<rect x="740" y="84" width="320" height="60" fill="#faf7f5" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="900.0" y="106.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">Proposed response</text>
<text x="900.0" y="124.0" text-anchor="middle" font-size="10.5" fill="#5a524b">from the Layer 4 Response Generator</text>
<path d="M900 144 L900 200" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="740" y="200" width="320" height="60" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="900.0" y="222.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">SC-1 · Ethical Guardrail Filter</text>
<text x="900.0" y="240.0" text-anchor="middle" font-size="10.5" fill="#5a524b">post-generation; runs on every reply</text>
<path d="M900 260 L900 300" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="740" y="300" width="320" height="56" fill="#e3eff2" stroke="#006680" stroke-width="1.3"/>
<text x="900.0" y="322.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#006680">Interaction Orchestrator (Layer 9)</text>
<text x="900.0" y="340.0" text-anchor="middle" font-size="10.5" fill="#5a524b">receives pass, modify or replace</text>
<path d="M900 356 L900 396" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="740" y="396" width="320" height="50" fill="#faf7f5" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="900.0" y="425.3" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">User</text>
<text x="22" y="544" font-size="10.5" fill="#5a524b">Crisis path: escalation and veto are enforced in the pipeline, not in the prompt</text>
</svg>
