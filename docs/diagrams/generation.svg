<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680" role="img" aria-labelledby="generation-title generation-desc" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="12">
<title id="generation-title">Layer 4: persona and two-stage generation</title>
<desc id="generation-desc">Three inputs feed deterministic persona steps, then a semantic planner (4a) and an emotion refiner (4b) produce the FinalResponsePacket.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#1a1a1a"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#800000"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#006680"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#006600"/></marker><marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#b45309"/></marker></defs>
<rect x="0.5" y="0.5" width="1099" height="679" fill="#faf7f5" stroke="#d9d0c8"/>
<text x="22" y="28" font-size="11" fill="#1a1a1a" font-weight="700">LAYER 4 · PERSONA &amp; GENERATION</text>
<rect x="40" y="60" width="340" height="96" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="210.0" y="82.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">TemporalContextObject · Layer 1</text>
<text x="210.0" y="100.0" text-anchor="middle" font-size="10.5" fill="#5a524b">circadian_band</text>
<text x="210.0" y="115.0" text-anchor="middle" font-size="10.5" fill="#5a524b">session_gap_category</text>
<rect x="40" y="172" width="340" height="96" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="210.0" y="194.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">MemoryPacket · Layer 2</text>
<text x="210.0" y="212.0" text-anchor="middle" font-size="10.5" fill="#5a524b">recalled_memories, identity_memory_entries</text>
<text x="210.0" y="227.0" text-anchor="middle" font-size="10.5" fill="#5a524b">stm_turns (last 10), uwm_context</text>
<rect x="40" y="284" width="340" height="96" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="210.0" y="306.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">EmotionIntentPacket · Layer 3</text>
<text x="210.0" y="324.0" text-anchor="middle" font-size="10.5" fill="#5a524b">primary_emotion, background_state, intent</text>
<text x="210.0" y="339.0" text-anchor="middle" font-size="10.5" fill="#5a524b">empathy_hypothesis, conversation_mode</text>
<text x="210.0" y="354.0" text-anchor="middle" font-size="10.5" fill="#5a524b">advice_gate, disclosure_depth_allowed</text>
<rect x="460" y="60" width="600" height="52" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="760.0" y="82.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">SC-1 · Persona State Resolver</text>
<text x="760.0" y="100.0" text-anchor="middle" font-size="10.5" fill="#5a524b">deterministic, under 5 ms</text>
<rect x="460" y="132" width="600" height="52" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="760.0" y="154.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">SC-2 · Relationship State Manager</text>
<text x="760.0" y="172.0" text-anchor="middle" font-size="10.5" fill="#5a524b">deterministic, under 3 ms</text>
<rect x="460" y="204" width="600" height="52" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="760.0" y="226.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">SC-3 · Tone &amp; Style Calibrator</text>
<text x="760.0" y="244.0" text-anchor="middle" font-size="10.5" fill="#5a524b">deterministic, under 2 ms</text>
<rect x="460" y="276" width="600" height="52" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="760.0" y="298.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">SC-4 · Persona Drift Detector</text>
<text x="760.0" y="316.0" text-anchor="middle" font-size="10.5" fill="#5a524b">per-turn identity guard, under 5 ms</text>
<rect x="460" y="348" width="600" height="52" fill="#800000" stroke="#800000" stroke-width="1.3"/>
<text x="760.0" y="370.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#faf7f5">SC-5 · Semantic Planner (4a)</text>
<text x="760.0" y="388.0" text-anchor="middle" font-size="10.5" fill="#faf7f5">LLM call, 300–500 ms: factual content</text>
<rect x="460" y="420" width="600" height="52" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="760.0" y="442.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">SC-6 · Emotion Refiner (4b)</text>
<text x="760.0" y="460.0" text-anchor="middle" font-size="10.5" fill="#5a524b">LLM call or skip, 200–400 ms: tone</text>
<path d="M760.0 112 L760.0 132" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M760.0 184 L760.0 204" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M760.0 256 L760.0 276" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M760.0 328 L760.0 348" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M760.0 400 L760.0 420" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="460" y="492" width="600" height="50" fill="#e3eff2" stroke="#006680" stroke-width="1.3"/>
<text x="760.0" y="514.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#006680">FinalResponsePacket</text>
<text x="760.0" y="532.0" text-anchor="middle" font-size="10.5" fill="#5a524b">passed to Layer 5 and Layer 9</text>
<path d="M760.0 472 L760.0 492" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="772.0" y="342" text-anchor="start" font-size="10.5" fill="#5a524b">PersonaPacket to 4a and 4b</text>
<text x="772.0" y="414" text-anchor="start" font-size="10.5" fill="#5a524b">SemanticDraft</text>
<path d="M380 108.0 L420 108.0" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M380 220.0 L420 220.0" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M380 332.0 L420 332.0" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M420 108.0 L420 332.0" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M420 86.0 L460 86.0" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="22" y="664" font-size="10.5" fill="#5a524b">Plan first (4a), then refine tone (4b); factual content is set before tone is applied</text>
</svg>
