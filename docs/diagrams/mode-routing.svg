<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" role="img" aria-labelledby="mode-routing-title mode-routing-desc" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="12">
<title id="mode-routing-title">Layer 3: conversation mode and routing</title>
<desc id="mode-routing-desc">The mode resolver fixes one conversation mode; casual messages take the fast System 1 path, while complex or emotional messages take the fuller System 2 path.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#1a1a1a"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#800000"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#006680"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#006600"/></marker><marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#b45309"/></marker></defs>
<rect x="0.5" y="0.5" width="1099" height="439" fill="#faf7f5" stroke="#d9d0c8"/>
<text x="22" y="28" font-size="11" fill="#1a1a1a" font-weight="700">LAYER 3 · MODE AND ROUTING</text>
<rect x="40" y="150" width="240" height="60" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="160.0" y="172.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">EmotionIntentPacket</text>
<text x="160.0" y="190.0" text-anchor="middle" font-size="10.5" fill="#5a524b">from Layer 3</text>
<rect x="340" y="150" width="240" height="60" fill="#800000" stroke="#800000" stroke-width="1.3"/>
<text x="460.0" y="172.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#faf7f5">Mode resolver</text>
<text x="460.0" y="190.0" text-anchor="middle" font-size="10.5" fill="#faf7f5">8 modes, deterministic</text>
<path d="M280 180 L340 180" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="660" y="60" width="400" height="56" fill="#f6e6e6" stroke="#800000" stroke-width="1.3"/>
<text x="860.0" y="82.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#800000">Crisis → Layer 11 veto</text>
<text x="860.0" y="100.0" text-anchor="middle" font-size="10.5" fill="#5a524b">replaces the reply when confirmed</text>
<rect x="660" y="170" width="400" height="56" fill="#e6f1e6" stroke="#006600" stroke-width="1.3"/>
<text x="860.0" y="192.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#006600">Casual or banter → System 1</text>
<text x="860.0" y="210.0" text-anchor="middle" font-size="10.5" fill="#5a524b">fast path, under 2 s; skips Emotion Refiner 4b</text>
<rect x="660" y="280" width="400" height="56" fill="#f8ead9" stroke="#b45309" stroke-width="1.3"/>
<text x="860.0" y="302.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#b45309">Complex or emotional → System 2</text>
<text x="860.0" y="320.0" text-anchor="middle" font-size="10.5" fill="#5a524b">plan (4a) then refine (4b); under 30 s</text>
<path d="M580 180 L620 180 L620 88 L660 88" fill="none" stroke="#800000" stroke-width="1.5" marker-end="url(#m)"/>
<path d="M580 180 L660 180" fill="none" stroke="#006600" stroke-width="1.5" marker-end="url(#g)"/>
<path d="M620 180 L620 308 L660 308" fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#y)"/>
<rect x="40" y="340" width="1020" height="56" fill="#faf7f5" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="550.0" y="362.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">Shared mode</text>
<text x="550.0" y="380.0" text-anchor="middle" font-size="10.5" fill="#5a524b">also governs Layer 2 context gating, Layer 4 constraints and Layer 9 pacing</text>
<text x="22" y="424" font-size="10.5" fill="#5a524b">Which of the 8 modes map to which route is not specified in the docs, so only the routes CLAUDE.md states are drawn.</text>
</svg>
