<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="1100" height="820" role="img" aria-labelledby="cold-start-title cold-start-desc" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="12">
<title id="cold-start-title">Layer 13: cold start overlay</title>
<desc id="cold-start-desc">A new user meets a temporary cold start overlay with elicitation and handling; a graduation check at each session end, then the normal runtime takes over.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#1a1a1a"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#800000"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#006680"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#006600"/></marker><marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#b45309"/></marker></defs>
<rect x="0.5" y="0.5" width="1099" height="819" fill="#faf7f5" stroke="#d9d0c8"/>
<text x="22" y="28" font-size="11" fill="#1a1a1a" font-weight="700">LAYER 13 · ONBOARDING &amp; COLD START</text>
<rect x="390" y="50" width="320" height="44" fill="#faf7f5" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="550.0" y="76.3" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">New user · first message</text>
<path d="M550 94 L550 120" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="120" width="1020" height="500" fill="none" stroke="#5a524b" stroke-width="1" stroke-dasharray="2 3"/>
<text x="52" y="138" font-size="10.5" font-weight="700" fill="#5a524b">Cold Start Engine · temporary overlay, active from T=0 until graduation</text>
<rect x="70" y="160" width="440" height="110" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="290.0" y="182.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">SC-1 · Progressive Elicitation</text>
<text x="290.0" y="200.0" text-anchor="middle" font-size="10.5" fill="#5a524b">ElicitationQueue: at most one question per session</text>
<text x="290.0" y="215.0" text-anchor="middle" font-size="10.5" fill="#5a524b">PassiveElicitationEngine</text>
<text x="290.0" y="230.0" text-anchor="middle" font-size="10.5" fill="#5a524b">ElicitationSurfacingPolicy</text>
<rect x="590" y="160" width="440" height="110" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="810.0" y="182.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">SC-2 · Cold Start Handling</text>
<text x="810.0" y="200.0" text-anchor="middle" font-size="10.5" fill="#5a524b">InitialState</text>
<text x="810.0" y="215.0" text-anchor="middle" font-size="10.5" fill="#5a524b">ColdStartConfig</text>
<text x="810.0" y="230.0" text-anchor="middle" font-size="10.5" fill="#5a524b">ColdStartContextBuilder</text>
<path d="M290 270 L290 292" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M810 270 L810 292" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M290 292 L810 292" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="340" y="310" width="420" height="70" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="550.0" y="332.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">Graduation evaluator</text>
<text x="550.0" y="350.0" text-anchor="middle" font-size="10.5" fill="#5a524b">checked at the end of every session</text>
<text x="550.0" y="365.0" text-anchor="middle" font-size="10.5" fill="#5a524b">all criteria must be met</text>
<path d="M550 292 L550 310" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M550 380 L550 430" fill="none" stroke="#5a524b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="562" y="410" text-anchor="start" font-size="10.5" fill="#5a524b">not yet graduated</text>
<rect x="70" y="430" width="960" height="70" fill="#faf7f5" stroke="#5a524b" stroke-width="1.3"/>
<text x="550.0" y="452.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#5a524b">SC-3 · Feature Introduction Pacing</text>
<text x="550.0" y="470.0" text-anchor="middle" font-size="10.5" fill="#5a524b">gates each feature until its readiness profile is met (not wired live)</text>
<rect x="70" y="520" width="960" height="70" fill="#faf7f5" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="550.0" y="542.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">Graduation requires nine criteria</text>
<text x="550.0" y="560.0" text-anchor="middle" font-size="10.5" fill="#5a524b">3+ sessions · 20+ exchanges · name or handle · life context · communication style</text>
<text x="550.0" y="575.0" text-anchor="middle" font-size="10.5" fill="#5a524b">emotional baseline · 2+ topic areas · primary reason · one named relationship</text>
<path d="M550 590 L550 620" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="340" y="660" width="420" height="60" fill="#e3eff2" stroke="#006680" stroke-width="1.3"/>
<text x="550.0" y="682.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#006680">Normal runtime · Layers 1–12</text>
<text x="550.0" y="700.0" text-anchor="middle" font-size="10.5" fill="#5a524b">the conversation orchestrator takes full control</text>
<path d="M550 620 L550 660" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="562" y="645" text-anchor="start" font-size="10.5" fill="#5a524b">self-terminates on graduation</text>
<text x="22" y="804" font-size="10.5" fill="#5a524b">Per the Layer 13 spec; FeaturePacingController is not wired in the live system</text>
</svg>
