<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="1100" height="660" role="img" aria-label="Response delivery, step by step: Layer 4 starts streaming, the format adapter sets the response shape, Layer 4 generates, the micro-interaction engine queues cues, the interaction orchestrator streams and sends, and after delivery writes are logged; in voice mode a synthesizer runs alongside the text stream." font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="12">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#1a1a1a"/></marker>
<marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#b45309"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1099" height="659" fill="#faf7f5" stroke="#d9d0c8"/>
<text x="22" y="28" font-size="11" fill="#1a1a1a" font-weight="700">RESPONSE DELIVERY, STEP BY STEP</text>
<rect x="40" y="60" width="460" height="60" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text text-anchor="middle" x="270" y="86" font-weight="700" font-family="'Libre Baskerville', Georgia, serif" font-size="13" fill="#1a1a1a">Layer 4 starts streaming</text>
<text text-anchor="middle" x="270" y="104" font-size="10.5" fill="#5a524b">Generation begins; nothing has been written yet</text>
<rect x="40" y="156" width="460" height="60" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text text-anchor="middle" x="270" y="182" font-weight="700" font-family="'Libre Baskerville', Georgia, serif" font-size="13" fill="#1a1a1a">SC-4 Format adapter · under 5 ms</text>
<text text-anchor="middle" x="270" y="200" font-size="10.5" fill="#5a524b">Computes FormatSpec and length target, passed in before writing</text>
<rect x="40" y="252" width="460" height="60" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text text-anchor="middle" x="270" y="278" font-weight="700" font-family="'Libre Baskerville', Georgia, serif" font-size="13" fill="#1a1a1a">Layer 4 generates, streaming</text>
<text text-anchor="middle" x="270" y="296" font-size="10.5" fill="#5a524b">FormatSpec is a constraint on the draft</text>
<rect x="40" y="348" width="460" height="60" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text text-anchor="middle" x="270" y="374" font-weight="700" font-family="'Libre Baskerville', Georgia, serif" font-size="13" fill="#1a1a1a">SC-2 Micro-interaction · under 5 ms</text>
<text text-anchor="middle" x="270" y="392" font-size="10.5" fill="#5a524b">Deterministic plan: acknowledgement and prefix queued</text>
<rect x="40" y="444" width="460" height="60" fill="#800000" stroke="#800000" stroke-width="1.3"/>
<text text-anchor="middle" x="270" y="470" font-weight="700" font-family="'Libre Baskerville', Georgia, serif" font-size="13" fill="#faf7f5">SC-1 Interaction orchestrator</text>
<text text-anchor="middle" x="270" y="488" font-size="10.5" fill="#faf7f5">Pause, streaming overlay, mid-stream self-edit, SEND when done</text>
<rect x="40" y="540" width="460" height="60" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text text-anchor="middle" x="270" y="566" font-weight="700" font-family="'Libre Baskerville', Georgia, serif" font-size="13" fill="#1a1a1a">After delivery</text>
<text text-anchor="middle" x="270" y="584" font-size="10.5" fill="#5a524b">Engagement signals · format profile update · events to Layer 12 audit</text>
<rect x="600" y="444" width="460" height="60" fill="#f5e8d2" stroke="#b45309" stroke-width="1.3"/>
<text text-anchor="middle" x="830" y="470" font-weight="700" font-family="'Libre Baskerville', Georgia, serif" font-size="13" fill="#b45309">SC-3 SSML synthesizer · voice mode only</text>
<text text-anchor="middle" x="830" y="488" font-size="10.5" fill="#5a524b">Voice transforms → SSML → TTS; audio plays alongside the text</text>
<path d="M270 120 L270 154" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M270 216 L270 250" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M270 312 L270 346" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M270 408 L270 442" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M270 504 L270 538" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="284" y="142" font-size="10.5" fill="#5a524b">SC-4 runs first</text>
<text x="284" y="238" font-size="10.5" fill="#5a524b">FormatSpec in</text>
<text x="284" y="334" font-size="10.5" fill="#5a524b">draft ready</text>
<text x="284" y="430" font-size="10.5" fill="#5a524b">plan ready</text>
<text x="284" y="526" font-size="10.5" fill="#5a524b">stream done</text>
<path d="M500 474 L598 474" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#y)"/>
<text x="549" y="466" text-anchor="middle" font-size="10.5" fill="#b45309" font-weight="700">voice on</text>
<text x="22" y="630" font-size="10.5" fill="#5a524b">solid: main path, top to bottom · dashed amber: voice mode only</text>
</svg>
