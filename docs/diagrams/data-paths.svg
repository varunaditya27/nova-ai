<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 530" width="1100" height="530" role="img" aria-label="Layer 10 data paths: five layers write into the life narrative engine asynchronously, and it provides context to Layer 4 at session start, to Layer 6 when items are due, and to Layer 7 on its next sync; Layer 9 does not read it directly." font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="12">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#1a1a1a"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1099" height="529" fill="#faf7f5" stroke="#d9d0c8"/>
<text x="22" y="28" font-size="11" fill="#1a1a1a" font-weight="700">WHAT FEEDS LAYER 10, AND WHAT LAYER 10 FEEDS</text>
<rect x="40" y="110" width="260" height="52" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text text-anchor="middle" x="170" y="132" font-weight="700" font-family="'Libre Baskerville', Georgia, serif" font-size="12.5" fill="#1a1a1a">Layer 2 · Memory</text>
<text text-anchor="middle" x="170" y="150" font-size="10.5" fill="#5a524b">episodes · facts · world model</text>
<rect x="40" y="190" width="260" height="52" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text text-anchor="middle" x="170" y="212" font-weight="700" font-family="'Libre Baskerville', Georgia, serif" font-size="12.5" fill="#1a1a1a">Layer 3 · Emotion</text>
<text text-anchor="middle" x="170" y="230" font-size="10.5" fill="#5a524b">per-session emotional records</text>
<rect x="40" y="270" width="260" height="52" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text text-anchor="middle" x="170" y="292" font-weight="700" font-family="'Libre Baskerville', Georgia, serif" font-size="12.5" fill="#1a1a1a">Layer 5 · Relationship</text>
<text text-anchor="middle" x="170" y="310" font-size="10.5" fill="#5a524b">tie strength · intimacy events</text>
<rect x="40" y="350" width="260" height="52" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text text-anchor="middle" x="170" y="372" font-weight="700" font-family="'Libre Baskerville', Georgia, serif" font-size="12.5" fill="#1a1a1a">Layer 7 · Goals</text>
<text text-anchor="middle" x="170" y="390" font-size="10.5" fill="#5a524b">goal changes · life events · wins</text>
<rect x="40" y="430" width="260" height="52" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text text-anchor="middle" x="170" y="452" font-weight="700" font-family="'Libre Baskerville', Georgia, serif" font-size="12.5" fill="#1a1a1a">Layer 1 · Temporal</text>
<text text-anchor="middle" x="170" y="470" font-size="10.5" fill="#5a524b">sessions · gaps · anomalies</text>
<rect x="400" y="110" width="300" height="372" fill="#800000" stroke="#800000" stroke-width="1.3"/>
<text text-anchor="middle" x="550" y="142" font-size="10.5" fill="#faf7f5" font-weight="700">LAYER 10 · LONGITUDINAL</text>
<text text-anchor="middle" x="550" y="172" font-weight="700" font-family="'Libre Baskerville', Georgia, serif" font-size="18" fill="#faf7f5">Life narrative engine</text>
<text text-anchor="middle" x="550" y="214" font-size="10.5" fill="#faf7f5">Writes queue here asynchronously.</text>
<text text-anchor="middle" x="550" y="232" font-size="10.5" fill="#faf7f5">Writes never block the reply loop.</text>
<rect x="800" y="110" width="260" height="52" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text text-anchor="middle" x="930" y="132" font-weight="700" font-family="'Libre Baskerville', Georgia, serif" font-size="12.5" fill="#1a1a1a">Layer 4 · Response</text>
<text text-anchor="middle" x="930" y="150" font-size="10.5" fill="#5a524b">narrative grounding · growth language</text>
<rect x="800" y="190" width="260" height="52" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text text-anchor="middle" x="930" y="212" font-weight="700" font-family="'Libre Baskerville', Georgia, serif" font-size="12.5" fill="#1a1a1a">Layer 6 · Proactivity</text>
<text text-anchor="middle" x="930" y="230" font-size="10.5" fill="#5a524b">retrospectives · calendar · patterns</text>
<rect x="800" y="270" width="260" height="52" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text text-anchor="middle" x="930" y="292" font-weight="700" font-family="'Libre Baskerville', Georgia, serif" font-size="12.5" fill="#1a1a1a">Layer 7 · Goals</text>
<text text-anchor="middle" x="930" y="310" font-size="10.5" fill="#5a524b">current chapter summary</text>
<rect x="800" y="350" width="260" height="52" fill="#faf7f5" stroke="#5a524b" stroke-width="1.3" stroke-dasharray="5 4"/>
<text text-anchor="middle" x="930" y="372" font-weight="700" font-family="'Libre Baskerville', Georgia, serif" font-size="12.5" fill="#5a524b">Layer 9 · Delivery</text>
<text text-anchor="middle" x="930" y="390" font-size="10.5" fill="#5a524b">no direct read; via Layer 4</text>
<path d="M300 136 L400 136" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M300 216 L400 216" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M300 296 L400 296" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M300 376 L400 376" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M300 456 L400 456" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M700 136 L800 136" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M700 216 L800 216" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M700 296 L800 296" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M700 376 L800 376" fill="none" stroke="#5a524b" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="750" y="130" text-anchor="middle" font-size="10.5" fill="#800000" font-weight="700">session start</text>
<text x="750" y="210" text-anchor="middle" font-size="10.5" fill="#800000" font-weight="700">when due</text>
<text x="750" y="290" text-anchor="middle" font-size="10.5" fill="#800000" font-weight="700">next sync</text>
<text x="750" y="370" text-anchor="middle" font-size="10.5" fill="#5a524b">not read</text>
<text x="22" y="512" font-size="10.5" fill="#5a524b">left: writes in, asynchronous · right: reads out, with the moment each one arrives · dashed: no direct read</text>
</svg>
