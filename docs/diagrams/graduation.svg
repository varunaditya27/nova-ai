<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400" role="img" aria-labelledby="graduation-title graduation-desc" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="12">
<title id="graduation-title">Layer 13: cold start to graduation</title>
<desc id="graduation-desc">The cold start overlay runs until a graduation check at session end finds all nine criteria met; then the overlay ends and the normal runtime takes over.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#1a1a1a"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#800000"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#006680"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#006600"/></marker><marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#b45309"/></marker></defs>
<rect x="0.5" y="0.5" width="1099" height="399" fill="#faf7f5" stroke="#d9d0c8"/>
<text x="22" y="28" font-size="11" fill="#1a1a1a" font-weight="700">LAYER 13 · GRADUATION</text>
<rect x="40" y="110" width="280" height="90" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="180.0" y="132.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">Cold start</text>
<text x="180.0" y="150.0" text-anchor="middle" font-size="10.5" fill="#5a524b">overlay active from T=0</text>
<text x="180.0" y="165.0" text-anchor="middle" font-size="10.5" fill="#5a524b">one question per session at most</text>
<rect x="410" y="110" width="280" height="90" fill="#f0ebe8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="550.0" y="132.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">Session ends: graduation check</text>
<text x="550.0" y="150.0" text-anchor="middle" font-size="10.5" fill="#5a524b">GraduationEvaluator runs</text>
<text x="550.0" y="165.0" text-anchor="middle" font-size="10.5" fill="#5a524b">every session</text>
<rect x="780" y="110" width="280" height="90" fill="#e3eff2" stroke="#006680" stroke-width="1.3"/>
<text x="920.0" y="132.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#006680">Graduated</text>
<text x="920.0" y="150.0" text-anchor="middle" font-size="10.5" fill="#5a524b">cold-start overlay self-terminates</text>
<text x="920.0" y="165.0" text-anchor="middle" font-size="10.5" fill="#5a524b">Layers 1–12 run in full</text>
<path d="M320 155 L410 155" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="365" y="146" text-anchor="middle" font-size="10.5" fill="#5a524b">each session</text>
<path d="M690 155 L780 155" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="735" y="146" text-anchor="middle" font-size="10.5" fill="#5a524b">all met</text>
<path d="M550 200 L550 240 L180 240 L180 200" fill="none" stroke="#5a524b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="375" y="262" text-anchor="middle" font-size="10.5" fill="#5a524b">not all met: stay in cold start</text>
<rect x="40" y="290" width="1020" height="70" fill="#faf7f5" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="550.0" y="312.0" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-size="13" font-weight="700" fill="#1a1a1a">Graduation requires all nine criteria</text>
<text x="550.0" y="330.0" text-anchor="middle" font-size="10.5" fill="#5a524b">3+ sessions · 20+ exchanges · name or handle · life context · communication style</text>
<text x="550.0" y="345.0" text-anchor="middle" font-size="10.5" fill="#5a524b">emotional baseline · 2+ topic areas · primary reason · one named relationship</text>
<text x="22" y="384" font-size="10.5" fill="#5a524b">Criteria per the Layer 13 spec. Pacing of individual features (SC-3) is not wired live.</text>
</svg>
