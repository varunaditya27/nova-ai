<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="Runtime topology: the Next.js app talks to FastAPI over REST and server-sent events. For recall, FastAPI has Ollama embed the query, asks Chroma for the nearest memory ids, then hydrates those rows from Postgres. Kokoro turns text into speech." font-family="ui-monospace, 'IBM Plex Mono', Menlo, monospace" font-size="12">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#1a1a1a"/></marker>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#800000"/></marker>
<marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#006680"/></marker>
</defs>
<rect x="0.5" y="0.5" width="999" height="429" fill="#faf7f5" stroke="#d9d0c8"/>
<text x="32" y="28" text-anchor="start" font-size="11" fill="#1a1a1a" font-weight="700">WHAT TALKS TO WHAT, AND IN WHAT ORDER FOR A RECALL</text>
<rect x="32" y="150" width="150" height="90" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="107.0" y="192.0" text-anchor="middle" font-weight="700" fill="#1a1a1a">Web app</text>
<text x="107.0" y="207.0" text-anchor="middle" font-size="10.5" fill="#5a524b">Next.js · React</text>
<text x="107.0" y="220.0" text-anchor="middle" font-size="10.5" fill="#5a524b">your browser</text>
<rect x="330" y="130" width="190" height="130" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="425.0" y="192.0" text-anchor="middle" font-weight="700" fill="#faf7f5">FastAPI</text>
<text x="425.0" y="207.0" text-anchor="middle" font-size="10.5" fill="#faf7f5">one orchestrator per turn</text>
<text x="425.0" y="220.0" text-anchor="middle" font-size="10.5" fill="#faf7f5">sync handlers on a worker</text>
<text x="425.0" y="233.0" text-anchor="middle" font-size="10.5" fill="#faf7f5">APScheduler runs inside</text>
<rect x="740" y="56" width="228" height="66" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="854.0" y="86.0" text-anchor="middle" font-weight="700" fill="#1a1a1a">Postgres</text>
<text x="854.0" y="101.0" text-anchor="middle" font-size="10.5" fill="#5a524b">per-layer state · message log</text>
<text x="854.0" y="114.0" text-anchor="middle" font-size="10.5" fill="#5a524b">two SHA-256 hash chains</text>
<rect x="740" y="164" width="228" height="66" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="854.0" y="194.0" text-anchor="middle" font-weight="700" fill="#1a1a1a">ChromaDB</text>
<text x="854.0" y="209.0" text-anchor="middle" font-size="10.5" fill="#5a524b">embeddings · cosine space</text>
<text x="854.0" y="222.0" text-anchor="middle" font-size="10.5" fill="#5a524b">episodic · semantic · identity</text>
<rect x="740" y="272" width="228" height="92" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="854.0" y="315.0" text-anchor="middle" font-weight="700" fill="#1a1a1a">Ollama (local)</text>
<text x="854.0" y="330.0" text-anchor="middle" font-size="10.5" fill="#5a524b">main 7B: reply + classify</text>
<text x="854.0" y="343.0" text-anchor="middle" font-size="10.5" fill="#5a524b">mini 2B: tool params</text>
<text x="854.0" y="356.0" text-anchor="middle" font-size="10.5" fill="#5a524b">nomic-embed-text: vectors</text>
<rect x="330" y="330" width="190" height="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="425.0" y="357.0" text-anchor="middle" font-weight="700" fill="#1a1a1a">Kokoro</text>
<text x="425.0" y="372.0" text-anchor="middle" font-size="10.5" fill="#5a524b">text → SSML → audio</text>
<path d="M184 185 L328 185" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="256" y="176" text-anchor="middle" font-size="10.5" fill="#5a524b" font-weight="400">REST</text>
<path d="M328 212 L184 212" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="256" y="230" text-anchor="middle" font-size="10.5" fill="#5a524b" font-weight="400">SSE stream</text>
<path d="M522 150 L560 150 L560 89 L738 89" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="650" y="82" text-anchor="middle" font-size="10.5" fill="#006680" font-weight="700">③ hydrate rows</text>
<path d="M522 197 L738 197" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="630" y="190" text-anchor="middle" font-size="10.5" fill="#006680" font-weight="700">② nearest ids</text>
<text x="630" y="214" text-anchor="middle" font-size="10" fill="#5a524b" font-weight="400">(linear scan if the index is cold)</text>
<path d="M522 245 L560 245 L560 311 L738 311" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="650" y="304" text-anchor="middle" font-size="10.5" fill="#006680" font-weight="700">① embed the query</text>
<path d="M425 262 L425 328" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="435" y="300" text-anchor="start" font-size="10.5" fill="#5a524b" font-weight="400">/voice</text>
<path d="M850 124 L850 162" fill="none" stroke="#006680" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#t)"/>
<text x="860" y="146" text-anchor="start" font-size="10.5" fill="#006680" font-weight="400">re-index on write</text>
</svg>
