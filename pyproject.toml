[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-ai"
version = "0.1.0"
description = "13-layer cognitive architecture for long-term human-AI companionship"
requires-python = ">=3.11"
dependencies = []            # base install is pure-stdlib; the offline test suite needs nothing here

[project.optional-dependencies]
infra = [
    "pyyaml>=5.4",
    "ollama>=0.3",
    "chromadb>=0.5",
    "sqlalchemy>=2",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "apscheduler>=3.10",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
dev = [
    "nova-ai[infra,api]",
    "pytest>=7",
    "pytest-mock>=3",
]

[tool.setuptools]
packages = ["config", "infra", "backend", "api", "background"]

[tool.pytest.ini_options]
markers = [
    "docker: integration test requiring a live dockerised service (auto-skips when unreachable)",
]
