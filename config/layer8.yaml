# Layer 8 Configuration — Tool Use & Actions
#
# These values mirror the module-level constants in backend/layer8_tools/ (the code is the
# single source of truth) and match docs/layer-8-architecture.md. Reproduced as real,
# machine-readable YAML for future re-tuning without code changes.
#
# Scope note: Layer 8 is the action layer (calendar, email, notes, reminders, web search) —
# NOT a safety layer. Crisis detection and safeguarding live in Layer 11. External backends
# (search API, calendar/email providers) and the intent/synthesis LLMs are injected as
# callables, so endpoints are wired by the pipeline, not this file.

layer8:

  # ── SC-2 Confirmation Gate (§4) ───────────────────────────────────────────
  confirmation_gate:
    # Fallback tier per action verb, used only when a plugin declares no tier (§4.3).
    action_tier_base:
      read: auto
      search: auto
      create: soft
      update: soft
      delete: hard
      send: hard
    # A plugin's declared tier is the AUTHORITATIVE baseline (it may lower a verb's default for
    # a genuinely safe op, e.g. a reversible reminder delete = AUTO). Intrinsic floors below sit
    # ON TOP and can only RAISE — a plugin can never lower below them (§4.3).
    intrinsic_floors:
      high_risk_forces: hard                   # risk_level == high -> HARD
      irreversible_external: hard              # not reversible AND external_impact -> HARD
      irreversible_floor: soft                 # not reversible (internal) -> at least SOFT
    auto_executes_without_prompt: true         # AUTO needs no user-in-the-loop (§4.1)

  # ── SC-1 confirmation security (§5.1) ─────────────────────────────────────
  confirmation_security:
    token_binding: sha256                      # token bound to tool+operation+parameters+user_id
    single_use: true                           # consumed on use — replay rejected
    ownership_checked: true                    # non-owner confirm/undo refused
    direct_path_fail_closed: true              # execute_tool refuses gated ops without a token

  # ── SC-3 Parameter Resolver (§6) ──────────────────────────────────────────
  parameter_resolver:
    clarifying_questions_per_turn: 1           # never bombard — one question per turn (§6.3)
    inference_confidence_threshold: 0.85       # auto-fill from context at/above this (§6.5)
    relative_date_terms: ["today", "tomorrow", "the day after tomorrow"]  # normalized (§6.4)

  # ── SC-4 Action Recorder (§7) ─────────────────────────────────────────────
  action_recorder:
    append_only: true                          # no deletions; undo is recorded, not erased
    link_to_episodic_memory: true              # actions are inspectable via Layer 12 / Layer 10

  # ── Plugins (§9) — per-operation tiers & reversibility ────────────────────
  plugins:
    calendar:
      create_event: { tier: soft, reversible: true,  external_impact: true }
      list_events:  { tier: auto, reversible: true,  external_impact: false }
      find_free_time: { tier: auto, reversible: true, external_impact: false }
      delete_event: { tier: hard, reversible: true,  external_impact: true }  # archived -> undo
    email:
      draft:        { tier: soft, reversible: true,  external_impact: false }
      send:         { tier: hard, reversible: false, external_impact: true }  # irreversible
      read_inbox:   { tier: auto, reversible: true,  external_impact: false }
    notes:
      create_note:  { tier: auto, reversible: true,  external_impact: false }
      append_to_note: { tier: auto, reversible: true, external_impact: false }
      delete_note:  { tier: soft, reversible: true,  external_impact: false }  # archived -> undo
    reminders:
      create_reminder: { tier: auto, reversible: true, external_impact: false }
      complete_reminder: { tier: auto, reversible: true, external_impact: false }
      delete_reminder: { tier: auto, reversible: true, external_impact: false }
    web_search:
      search:       { tier: auto, reversible: true,  external_impact: false }
      cache_ttl_hours: 1                       # don't re-hit the API for the same query (§9.5)

  plugin_health_checks:
    calendar_oauth_expiry_warning_days: 7
    web_search_api_timeout_ms: 5000
    email_draft_timeout_ms: 10000

  # ── Hard rules (enforced in code) ─────────────────────────────────────────
  principles:
    high_risk_requires_explicit_confirmation: true
    confirmation_is_a_bound_single_use_token: true   # not a trusted boolean (§5.1)
    direct_execution_path_is_fail_closed: true       # no side door around the gate
    undo_enforces_ownership: true
    every_action_recorded_and_inspectable: true
    audit_trail_is_append_only: true
    deletes_are_logical_not_destructive: true
    sent_email_is_irreversible: true
    user_always_has_final_say: true
