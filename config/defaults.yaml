# Nova AI — default configuration (loaded first; override files deep-merge over this).
system:
  database_url: ${DATABASE_URL:-postgresql+psycopg://nova:nova@postgres:5432/nova}
  chroma_host: ${CHROMA_HOST:-chroma}
  chroma_port: ${CHROMA_PORT:-8000}
  default_user_id: ${NOVA_USER_ID:-local-user}
  debug_mode: false
  # Single-user personal deployment — no per-user timezone capture exists (see
  # docs/layer-1-architecture.md §16), so this fixed offset stands in for it everywhere Layer 1
  # converts a stored UTC timestamp to local wall-clock time (circadian band, historical
  # band histogram). India Standard Time: UTC+5:30.
  timezone_offset_hours: 5.5

api:
  host: ${API_HOST:-0.0.0.0}
  port: 8000
  # :3001 is Next's own automatic fallback when :3000 is already taken (dev-time only).
  cors_origins: ["http://localhost:3000"]

# Fully offline: every role runs against local Ollama. Two model-size tiers, each a single env
# knob so swapping the model everywhere that tier is used is a one-line change (or `docker/.env`):
#   NOVA_MAIN_MODEL — generation (System 1 fast path + System 2 deep path). 7-11B class.
#   NOVA_MINI_MODEL — fast structured tasks (Layer-8 tool-intent param extraction). 1-2B class.
llm:
  system1:
    provider: ollama
    model: ${NOVA_MAIN_MODEL:-qwen2.5:7b}
    temperature: 0.5
    max_tokens: 1024
  system2:
    provider: ollama
    model: ${NOVA_MAIN_MODEL:-qwen2.5:7b}
    temperature: 0.7
    max_tokens: 2048
  embeddings:
    provider: ollama
    model: nomic-embed-text
  intent:                       # Layer-8 tool intent: fast, lightweight model for param extraction
    provider: ollama
    model: ${NOVA_MINI_MODEL:-gemma2:2b}
    temperature: 0.0            # deterministic structured JSON
    max_tokens: 256
  providers:
    ollama:
      base_url: ${OLLAMA_BASE_URL:-http://ollama:11434}

memory:
  recall_weights: { alpha: 0.40, beta: 0.30, gamma: 0.20, delta: 0.10 }
  softmax_temperature: 0.7
  decay_rate: 0.92
  reinforcement_similarity_threshold: 0.5

onboarding:
  graduation_sessions: 5

tts:                          # Layer-9 voice synthesis (Kokoro, OpenAI-compatible /v1/audio/speech)
  endpoint: ${KOKORO_URL:-http://kokoro:8880}
  default_voice: af_sky

scheduler:
  enabled: true             # start the in-process APScheduler in the API lifespan (set false to opt out)
  memory_consolidation_hours: 2
  proactive_check_minutes: 30
  pattern_detection_days: 7
  integrity_check_hours: 24
  longitudinal_summary_days: 7
  dependency_monitor_days: 7

timing:
  system1_timeout_ms: 2000
  system2_timeout_ms: 30000
