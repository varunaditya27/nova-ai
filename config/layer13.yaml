# Layer 13 Configuration — Onboarding & Cold Start Architecture
#
# These values mirror the module-level constants in backend/layer13_onboarding/ (the code is the
# single source of truth) and match docs/layer-13-architecture.md. Reproduced as real,
# machine-readable YAML for future re-tuning without code changes.
#
# Three principles drive everything below: earn before asking, infer before asking, delay
# features (not presence). Hard invariant: safety is never gated.

layer13:

  # ── SC-2 Cold start population defaults (§5.1) ────────────────────────────
  initial_state:
    personality_vector:                       # population-center defaults for unknown users
      warmth: 0.75
      verbosity: 0.45
      humor: 0.35
      formality: 0.40
      empathy_bias: 0.70
      sarcasm_threshold: 0.20
      assertiveness: 0.50
      curiosity_expression: 0.65
      directness: 0.55
    emotional_baseline:
      valence: 0.15                           # slightly positive
      arousal: 0.20                           # calm
      engagement_level: 0.60                  # attentive
    relationship_stage: new_acquaintance

  # ── SC-2 Cold start behavioral overlay (§5.1) ─────────────────────────────
  behavior_config:
    suppress_memory_retrieval_failures: true
    personality_drift_gate_multiplier: 0.30   # drift is slow until there is enough data
    proactivity_mode: observe_only            # Layer 6 silent during cold start
    longitudinal_mode: seeded_but_silent      # Layer 10 seeded, chapters off until graduation
    relationship_stage_advance_gate: 0.50
    relationship_stage_advance_gate_cold_start: 0.75
    max_elicitation_per_session: 1
    elicitation_embargo_on_emotional_intensity: 0.60
    safety_layer_active: true                  # Layer 11 fully on from message 0; never gated

  # ── SC-1 Progressive elicitation (§4.3-§4.4) ──────────────────────────────
  elicitation:
    early_period_sessions: 14                  # first two weeks
    max_elicitation_per_session: 1            # hard rate limit in early period
    priority3_emotional_embargo: 0.60         # nice-to-have never surfaces above this intensity
    priority2_acute_distress_embargo: 0.80    # important items suppressed above this intensity
    categories: [identity, life_context, communication_pref, goals,
                 relationships, values, emotional_style, reason_for_use]
    timeline:
      phase_1: {sessions: "1", rule: "observe; at most the name, only if not given"}
      phase_2: {sessions: "2-10", rule: "one natural question per session, if triggered"}
      phase_3: {sessions: "11+", rule: "ongoing discovery; queue still rate-limits"}

  # ── SC-1 Passive elicitation (§4.5) ───────────────────────────────────────
  passive_extractors:                         # pure regex + heuristics, no LLM (<20ms target)
    - vocabulary_register
    - emotional_expression_style
    - topic_approach
    - self_disclosure_comfort
    - temporal_pattern
    - named_people
    - life_context
    - urgency
    - communication_style
  life_phase_inference_confidence_threshold: 0.50
  comm_profile_min_message_index: 3

  # ── SC-2 Graduation criteria (§5.4) ───────────────────────────────────────
  graduation:
    required:
      minimum_sessions: 3
      minimum_exchanges: 20
      name_or_handle_known: true
      broad_life_context_known: true
      communication_style_established: true
      emotional_baseline_calibrated: true
      primary_topic_areas_identified: 2
    nice_to_have: [primary_reason_known, one_named_relationship]
    silent_handoff: true                      # no user-visible change on graduation

  # ── SC-3 Feature introduction pacing (§6.3) ───────────────────────────────
  feature_pacing:
    # feature_id: [min_sessions, min_exchanges, introduction_style]
    personality_adaptation: [1, 1, silent]
    basic_episodic_memory: [2, 5, silent]
    semantic_facts_usage: [3, 10, silent]
    goal_tracking: [4, 20, soft_offer]
    memory_audit: [5, 25, explained]
    weekly_summary: [5, 30, soft_offer]
    proactive_checkins: [8, 50, soft_offer]
    pattern_observations: [10, 60, soft_offer]
    longitudinal_narrative: [20, 150, soft_offer]
    retrospective: [60, 400, soft_offer]
    crisis_resource_awareness: [0, 0, explained]   # SAFETY EXCEPTION — never gated

  # ── First message (§5.2) ──────────────────────────────────────────────────
  first_message:
    fallback: "Hey. What's on your mind?"
    late_night_variant: true
